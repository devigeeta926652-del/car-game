<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate 3D Car Racing</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 font-family:Arial;
 background:#111;
 touch-action:none;
}
canvas{display:block}

.panel{
 position:fixed;
 inset:0;
 z-index:20;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 background:linear-gradient(#000b,#111d);
 color:white;
 text-align:center;
}

.panel h1{
 font-size:38px;
 margin:10px;
}

.panel button{
 width:220px;
 height:55px;
 margin:8px;
 border:0;
 border-radius:15px;
 font-size:18px;
 font-weight:bold;
}

#gameUI{display:none}

#hud{
 position:fixed;
 top:10px;
 left:10px;
 z-index:10;
 color:white;
 background:#000b;
 padding:10px;
 border-radius:12px;
 font-size:17px;
}

#controls{
 position:fixed;
 bottom:18px;
 left:0;
 width:100%;
 z-index:10;
 display:flex;
 justify-content:space-between;
 padding:0 20px;
}

.ctrl{
 width:70px;
 height:60px;
 border:0;
 border-radius:18px;
 font-size:26px;
 font-weight:bold;
 background:#ffffffdd;
}

#middle{
 display:flex;
 gap:10px;
}

#gas{
 position:fixed;
 right:25px;
 bottom:105px;
 width:85px;
 height:85px;
 border:0;
 border-radius:50%;
 background:#19a84a;
 color:white;
 font-weight:bold;
}

#nitro{
 position:fixed;
 right:125px;
 bottom:105px;
 width:85px;
 height:85px;
 border:0;
 border-radius:50%;
 background:#147be8;
 color:white;
 font-weight:bold;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="panel">
<h1>🏎️ 3D RACING</h1>
<p>Ultimate Car Racing</p>

<button onclick="showGarage()">GARAGE</button>
<button onclick="startGame()">START RACE</button>
</div>

<!-- GARAGE -->
<div id="garage" class="panel" style="display:none">

<h1>🚗 GARAGE</h1>

<p id="selected">
Selected: Blue Car
</p>

<button onclick="selectCar(0)">
🔵 BLUE CAR
</button>

<button onclick="selectCar(1)">
🔴 RED CAR
</button>

<button onclick="selectCar(2)">
🟢 GREEN CAR
</button>

<button onclick="startGame()">
🏁 RACE
</button>

<button onclick="backMenu()">
⬅ MENU
</button>

</div>

<!-- GAME UI -->
<div id="gameUI">

<div id="hud">

🚗 SPEED:
<span id="speed">0</span>
<br>

🪙 COINS:
<span id="coins">0</span>
<br>

🏆 SCORE:
<span id="score">0</span>
<br>

🚀 NITRO:
<span id="nitroText">100</span>%

</div>

<div id="controls">

<button class="ctrl" id="left">
◀
</button>

<div id="middle">

<button class="ctrl" id="brake">
▼
</button>

<button class="ctrl" id="right">
▶
</button>

</div>

</div>

<button id="gas">
GAS
</button>

<button id="nitro">
NITRO
</button>

</div>

<!-- RESULT -->
<div id="result" class="panel" style="display:none">

<h1 id="resultTitle">
🏁 RACE FINISHED!
</h1>

<h2 id="finalScore">
Score: 0
</h2>

<h2 id="finalCoins">
Coins: 0
</h2>

<button onclick="startGame()">
🔄 PLAY AGAIN
</button>

<button onclick="backMenu()">
🏠 MENU
</button>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================
VARIABLES
========================= */

let selectedCar=0;
let running=false;

let speed=0;
let coins=0;
let score=0;
let nitroPower=100;

let left=false;
let right=false;
let gas=false;
let brake=false;
let turbo=false;

let obstacles=[];
let coinObjects=[];

/* =========================
SCENE
========================= */

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x75c9ff);

/* =========================
CAMERA
========================= */

const camera=
new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
0.1,
1000
);

/* =========================
RENDERER
========================= */

const renderer=
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
renderer.domElement
);

/* =========================
LIGHT
========================= */

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x555555,
2
));

const sun=
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
30,50,20
);

sun.castShadow=true;

scene.add(sun);

/* =========================
GROUND
========================= */

const ground=
new THREE.Mesh(
new THREE.PlaneGeometry(
200,
1200
),
new THREE.MeshStandardMaterial({
color:0x3b9639
}));

ground.rotation.x=
-Math.PI/2;

ground.position.z=
-500;

scene.add(ground);

/* =========================
ROAD
========================= */

const road=
new THREE.Mesh(
new THREE.PlaneGeometry(
16,
1200
),
new THREE.MeshStandardMaterial({
color:0x303030
}));

road.rotation.x=
-Math.PI/2;

road.position.set(
0,.02,-500
);

scene.add(road);

/* =========================
ROAD MARKINGS
========================= */

for(
let z=0;
z>-1200;
z-=12
){

const line=
new THREE.Mesh(
new THREE.BoxGeometry(
.45,.05,6
),
new THREE.MeshStandardMaterial({
color:0xffffff
}));

line.position.set(
0,.06,z
);

scene.add(line);
}

/* =========================
CAR
========================= */

const car=
new THREE.Group();

function buildCar(color){

car.clear();

/* BODY */

const body=
new THREE.Mesh(
new THREE.BoxGeometry(
2.3,.7,4
),
new THREE.MeshStandardMaterial({
color:color
}));

body.position.y=.7;

body.castShadow=true;

car.add(body);

/* CABIN */

const cabin=
new THREE.Mesh(
new THREE.BoxGeometry(
1.7,.65,1.8
),
new THREE.MeshStandardMaterial({
color:0x111827
}));

cabin.position.set(
0,1.25,.2
);

cabin.castShadow=true;

car.add(cabin);

/* WHEELS */

const positions=[
[-1.15,-1.35],
[1.15,-1.35],
[-1.15,1.35],
[1.15,1.35]
];

for(
const p of positions
){

const wheel=
new THREE.Mesh(
new THREE.CylinderGeometry(
.45,.45,.35,20
),
new THREE.MeshStandardMaterial({
color:0x111111
}));

wheel.rotation.z=
Math.PI/2;

wheel.position.set(
p[0],
.45,
p[1]
);

wheel.castShadow=true;

car.add(wheel);
}

car.position.set(
0,0,10
);
}

buildCar(0x1769ff);

scene.add(car);

/* =========================
CAR SELECTION
========================= */

window.selectCar=function(n){

selectedCar=n;

let colors=[
0x1769ff,
0xff2020,
0x20b84b
];

let names=[
"Blue Car",
"Red Car",
"Green Car"
];

buildCar(colors[n]);

document.getElementById(
"selected"
).textContent=
"Selected: "+names[n];
};

/* =========================
OBSTACLES
========================= */

function createObstacle(z){

const o=
new THREE.Mesh(
new THREE.BoxGeometry(
2,1.5,2
),
new THREE.MeshStandardMaterial({
color:0xff8c00
}));

let lanes=[
-5,0,5
];

o.position.set(
lanes[
Math.floor(
Math.random()*3
)],
.75,
z
);

o.castShadow=true;

scene.add(o);

obstacles.push(o);
}

/* =========================
COINS
========================= */

function createCoin(z){

const c=
new THREE.Mesh(
new THREE.TorusGeometry(
.45,.12,12,24
),
new THREE.MeshStandardMaterial({
color:0xffd21f,
emissive:0x664400
}));

let lanes=[
-5,0,5
];

c.position.set(
lanes[
Math.floor(
Math.random()*3
)],
1,
z
);

c.rotation.x=
Math.PI/2;

scene.add(c);

coinObjects.push(c);
}

/* =========================
TREES
========================= */

function createTree(x,z){

const trunk=
new THREE.Mesh(
new THREE.CylinderGeometry(
.25,.3,2,10
),
new THREE.MeshStandardMaterial({
color:0x704020
}));

trunk.position.set(
x,1,z
);

scene.add(trunk);

const leaves=
new THREE.Mesh(
new THREE.SphereGeometry(
1.5,12,12
),
new THREE.MeshStandardMaterial({
color:0x167b2c
}));

leaves.position.set(
x,2.7,z
);

scene.add(leaves);
}

/* WORLD */

for(
let z=-30;
z>-1000;
z-=30
){

createObstacle(z);

if(
Math.random()>.25
){
createCoin(z-12);
}

createTree(-14,z);

createTree(
14,
z-15
);
}

/* =========================
BUTTON CONTROL
========================= */

function hold(id,down,up){

const b=
document.getElementById(id);

b.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
down();
});

b.addEventListener(
"pointerup",
up
);

b.addEventListener(
"pointercancel",
up
);

b.addEventListener(
"pointerleave",
up
);
}

hold(
"left",
()=>left=true,
()=>left=false
);

hold(
"right",
()=>right=true,
()=>right=false
);

hold(
"gas",
()=>gas=true,
()=>gas=false
);

hold(
"brake",
()=>brake=true,
()=>brake=false
);

hold(
"nitro",
()=>turbo=true,
()=>turbo=false
);

/* =========================
KEYBOARD
========================= */

document.addEventListener(
"keydown",
e=>{

if(e.key==="ArrowLeft")
left=true;

if(e.key==="ArrowRight")
right=true;

if(e.key==="ArrowUp")
gas=true;

if(e.key==="ArrowDown")
brake=true;

if(e.key===" ")
turbo=true;

});

document.addEventListener(
"keyup",
e=>{

if(e.key==="ArrowLeft")
left=false;

if(e.key==="ArrowRight")
right=false;

if(e.key==="ArrowUp")
gas=false;

if(e.key==="ArrowDown")
brake=false;

if(e.key===" ")
turbo=false;

});

/* =========================
START GAME
========================= */

window.startGame=function(){

document.getElementById(
"menu"
).style.display="none";

document.getElementById(
"garage"
).style.display="none";

document.getElementById(
"result"
).style.display="none";

document.getElementById(
"gameUI"
).style.display="block";

speed=0;
coins=0;
score=0;
nitroPower=100;

car.position.set(
0,0,10
);

running=true;
};

/* =========================
GARAGE
========================= */

window.showGarage=function(){

document.getElementById(
"menu"
).style.display="none";

document.getElementById(
"garage"
).style.display="flex";
};

window.backMenu=function(){

running=false;

document.getElementById(
"garage"
).style.display="none";

document.getElementById(
"result"
).style.display="none";

document.getElementById(
"gameUI"
).style.display="none";

document.getElementById(
"menu"
).style.display="flex";
};

/* =========================
GAME OVER
========================= */

function gameOver(){

running=false;

speed=0;

document.getElementById(
"gameUI"
).style.display="none";

document.getElementById(
"result"
).style.display="flex";

document.getElementById(
"resultTitle"
).textContent=
"💥 GAME OVER!";

document.getElementById(
"finalScore"
).textContent=
"🏆 Score: "+score;

document.getElementById(
"finalCoins"
).textContent=
"🪙 Coins: "+coins;
}

/* =========================
FINISH
========================= */

function finishRace(){

running=false;

document.getElementById(
"gameUI"
).style.display="none";

document.getElementById(
"result"
).style.display="flex";

document.getElementById(
"resultTitle"
).textContent=
"🏁 RACE FINISHED!";

document.getElementById(
"finalScore"
).textContent=
"🏆 Score: "+score;

document.getElementById(
"finalCoins"
).textContent=
"🪙 Coins: "+coins;
}

/* =========================
GAME LOOP
========================= */

function animate(){

requestAnimationFrame(
animate
);

if(running){

/* ACCELERATION */

if(gas)
speed+=.018;
else
speed-=.006;

if(brake)
speed-=.035;

/* NITRO */

if(
turbo &&
nitroPower>0
){

speed+=.045;

nitroPower-=.7;
}

/* LIMIT */

speed=
THREE.MathUtils.clamp(
speed,
0,
.95
);

nitroPower=
THREE.MathUtils.clamp(
nitroPower,
0,
100
);

/* STEERING */

if(left)
car.position.x-=.17;

if(right)
car.position.x+=.17;

car.position.x=
THREE.MathUtils.clamp(
car.position.x,
-6,
6
);

/* =========================
OBSTACLE MOVEMENT
========================= */

for(
const o of obstacles
){

o.position.z+=speed;

/* COLLISION */

const dx=
Math.abs(
car.position.x-
o.position.x
);

const dz=
Math.abs(
car.position.z-
o.position.z
);

/* 🚗💥 GAME OVER */

if(
dx<1.6 &&
dz<2.5
){

gameOver();

break;
}

/* PASSED */

if(
o.position.z>
car.position.z+8
){

score++;

o.position.z=
-900-
Math.random()*200;

let lanes=[
-5,0,5
];

o.position.x=
lanes[
Math.floor(
Math.random()*3
)];
}
}

/* =========================
COINS
========================= */

for(
const c of coinObjects
){

c.rotation.y+=.08;

c.position.z+=speed;

const dx=
Math.abs(
car.position.x-
c.position.x
);

const dz=
Math.abs(
car.position.z-
c.position.z
);

if(
dx<1.5 &&
dz<2
){

coins++;

score+=10;

c.position.z=
-1000-
Math.random()*300;
}
}

/* FINISH */

if(
car.position.z<
-800
){

finishRace();
}

/* CAMERA */

const camTarget=
new THREE.Vector3(
car.position.x,
5,
car.position.z+10
);

camera.position.lerp(
camTarget,
.09
);

camera.lookAt(
car.position.x,
.8,
car.position.z-8
);

/* HUD */

document.getElementById(
"speed"
).textContent=
Math.floor(
speed*180
);

document.getElementById(
"coins"
).textContent=
coins;

document.getElementById(
"score"
).textContent=
score;

document.getElementById(
"nitroText"
).textContent=
Math.floor(
nitroPower
);

}

renderer.render(
scene,
camera
);
}

/* =========================
START RENDER
========================= */

camera.position.set(
0,5,22
);

animate();

/* =========================
RESIZE
========================= */

window.addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});

</script>

</body>
</html>
